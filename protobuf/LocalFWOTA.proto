syntax = "proto3";

message LocalUpgInfoResDTO {
  uint32 time = 1;
  int32 total_size = 2;
  int32 dev_type = 3;
  int32 crc = 4;
  int64 sn = 5;
}

message LocalUpgInfoReqDTO {
  int32 err_code = 1;
  int32 rate = 2;
  int32 state = 3;
  int32 s_range = 4;
}

message LocalUpgRateResDTO {
  uint32 time = 1;
}

message LocalUpgRateReqDTO {
  int32 err_code = 1;
  int32 rate = 2;
}
